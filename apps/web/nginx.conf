server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin LiveKit signaling (mirrors vite.config.ts /rtc proxy).
    # URI passed through so /rtc and /rtc/validate reach livekit:7880 unchanged.
    # Variable proxy_pass defers DNS to request time (avoids startup NXDOMAIN).
    location /rtc {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $livekit_upstream livekit:7880;
        proxy_pass http://$livekit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Same-origin API proxy (mirrors vite.config.ts dev proxy)
    location /v1/ {
        proxy_pass http://api:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /healthz {
        proxy_pass http://api:18080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://api:18080/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
