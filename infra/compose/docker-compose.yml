services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metuai
      POSTGRES_PASSWORD: metuai
      POSTGRES_DB: metuai
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metuai"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 用配置文件而非 --dev：egress 依赖 SFU 侧 Redis 派发任务，dev 模式不配 Redis。
  # 密钥与端口沿用 dev 默认值（devkey/secret、7880/7881/7882）。
  livekit:
    image: livekit/livekit-server:v1.8.4
    command: --config /etc/livekit/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "17880:7880"
      - "17881:7881"
      - "17882:7882/udp"
      # WebRTC ICE 端口（宿主机浏览器 + 容器内 egress Chrome）
      - "50000-50100:50000-50100/udp"

  # 房间合成录制会在容器内跑 Chrome，需要较大的 /dev/shm 和 SYS_ADMIN。
  # S3 凭证不写在这里：网关在每次 StartEgress 请求里下发，便于按会议切换存储。
  livekit-egress:
    image: livekit/egress:v1.8.4
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      minio:
        condition: service_started
    environment:
      EGRESS_CONFIG_BODY: |
        log_level: info
        api_key: devkey
        api_secret: secret
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        insecure: true
        cpu_cost:
          room_composite_cpu_cost: 3
          track_composite_cpu_cost: 2
          track_cpu_cost: 1
    shm_size: 1gb
    cap_add:
      - SYS_ADMIN
    # GPU 可选；CPU 环境允许队列延迟（架构已假定）。
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: metuai
      MINIO_ROOT_PASSWORD: metuai-secret
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 metuai metuai-secret;
      mc mb -p local/metuai-media || true;
      exit 0;
      "

  # Go gateway. JWT secrets must be set at runtime (see .env.example); never baked into the image.
  api:
    build:
      context: ../../services/gateway
      dockerfile: Dockerfile
    ports:
      - "18080:18080"
    environment:
      HTTP_ADDR: ":18080"
      # Fail closed if secrets are missing from the shell or compose .env file.
      EMPLOYEE_JWT_SECRET: ${EMPLOYEE_JWT_SECRET:?must be set}
      GUEST_JWT_SECRET: ${GUEST_JWT_SECRET:?must be set}
      # In-network hosts (override host-dev 127.0.0.1 values from .env.example).
      DATABASE_URL: postgres://metuai:metuai@postgres:5432/metuai?sslmode=disable
      LIVEKIT_URL: ws://livekit:7880
      # Browser-facing LiveKit (published host port); token JSON uses this, not LIVEKIT_URL.
      LIVEKIT_PUBLIC_URL: ws://127.0.0.1:17880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      DEV_ALLOW_EMPLOYEE_WEB: ${DEV_ALLOW_EMPLOYEE_WEB:-true}
      IDLE_END_MINUTES: ${IDLE_END_MINUTES:-10}
      UPLOAD_SPOOL_DIR: /tmp/metuai-uploads
      APP_BASE_URL: ${APP_BASE_URL:-http://127.0.0.1:5173}
      EGRESS_ENABLED: ${EGRESS_ENABLED:-false}
      EGRESS_FINALIZE_SECONDS: ${EGRESS_FINALIZE_SECONDS:-8}
      S3_ENDPOINT: http://minio:9000
      S3_UPLOAD_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-metuai-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-metuai}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-metuai-secret}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # Optional SMTP / spool / Vespa — pass through if set on the host/.env
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      METUAI_SPOOL_KEY: ${METUAI_SPOOL_KEY:-}
      VESPA_URL: ${VESPA_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:18080/readyz >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  # Vite production build behind nginx; proxies /v1 /healthz /readyz to api.
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
