services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metuai
      POSTGRES_PASSWORD: metuai
      POSTGRES_DB: metuai
    # Host 55432 avoids clashing with common local Postgres on 5432.
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metuai"]
      interval: 3s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.8.4
    command: --dev --bind 0.0.0.0
    # Host 17880 avoids clashing with other LiveKit/dev servers on 7880.
    ports:
      - "17880:7880"
      - "17881:7881"
      - "17882:7882/udp"
