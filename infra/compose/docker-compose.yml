services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metuai
      POSTGRES_PASSWORD: metuai
      POSTGRES_DB: metuai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metuai"]
      interval: 3s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.8.4
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
